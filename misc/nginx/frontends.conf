# 三端独立子域名部署（生产）：c / admin / merchant .tiaowulan.com
# 每个子域使用各自真实证书：misc/certs/<domain>.pem + <domain>.key
# 由 docker-compose 把 misc/certs 挂到 /etc/nginx/certs，并把本文件挂到 conf.d。
# 前端容器与后端 flora-agent 同属 compose 网络，/api、/uploads、/generated 反代到 flora-agent:8000。

# ---------- HTTP → HTTPS 重定向（含 ACME 挑战目录，便于后续自动续期）----------
server {
    listen 80;
    server_name c.tiaowulan.com admin.tiaowulan.com merchant.tiaowulan.com;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- C 端（顾客端）----------
server {
    listen 443 ssl;
    server_name c.tiaowulan.com;
    ssl_certificate     /etc/nginx/certs/c.tiaowulan.com.pem;
    ssl_certificate_key /etc/nginx/certs/c.tiaowulan.com.key;
    root /usr/share/nginx/html;
    index index.html;
    rewrite ^/$ /index.html break;
    location /api/ {
        proxy_pass http://flora-agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/  { proxy_pass http://flora-agent:8000; }
    location /generated/ { proxy_pass http://flora-agent:8000; }
    location / { try_files $uri $uri/ /index.html; }
}

