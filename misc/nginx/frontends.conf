# 三端独立域名部署（阶段6）：同一 dist 三入口，按端口/域名区分。
# 开发期：localhost:5173(C端) / 5174(管理端) / 5175(商家端) ←→ 容器内 5173/5174/5175。
# 上线期：三个 server 块各改 listen 80 + server_name 真实域名（c/admin/merchant.xxx.com），
# 根路径 rewrite 到对应 html；/api、/uploads、/generated 反代到后端容器 flora-agent:8000。

# ---------- C 端（顾客端） ----------
server {
    listen 5173;
    server_name c.xxx.com;  # 上线改为真实域名
    root /usr/share/nginx/html;
    index index.html;

    rewrite ^/$ /index.html break;

    location /api/ {
        proxy_pass http://flora-agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /uploads/ {
        proxy_pass http://flora-agent:8000;
    }
    location /generated/ {
        proxy_pass http://flora-agent:8000;
    }
    location / { try_files $uri $uri/ /index.html; }
}

# ---------- 管理端 ----------
server {
