<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flora 花艺智能体</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-logo">🌸</span>
        <div class="brand-text">
          <strong>Flora 花艺智能体</strong>
          <small id="stageTag">准备就绪</small>
        </div>
      </div>
      <button id="resetBtn" class="reset-btn" title="重新开始">↻</button>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="quickStart" class="quick-start">
      <span class="qs-label">试试这些：</span>
      <button class="qs-chip" data-q="想给妈妈买一束花，预算 200 元左右">给妈妈买花</button>
      <button class="qs-chip" data-q="女朋友生日，想要粉色系浪漫一点的">女友生日</button>
      <button class="qs-chip" data-q="想自己 DIY 一束向日葵主题的花">DIY 向日葵</button>
    </div>

    <footer class="composer">
      <input id="input" class="composer-input" type="text" autocomplete="off"
             placeholder="说说你的心意、预算、对象…" />
      <button id="sendBtn" class="send-btn">发送</button>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
